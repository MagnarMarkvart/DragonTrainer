spring.datasource.url=jdbc:h2:mem:dragontrainer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

spring.docker.compose.enabled=false

game.bot.enabled=false

game.api.base-url=http://localhost:9999
game.api.start-game=/api/v2/game/start
game.api.fetch-ads=/api/v2/{gameId}/messages
game.api.solve-task=/api/v2/{gameId}/solve/{adId}
game.api.open-store=/api/v2/{gameId}/shop
game.api.buy-item=/api/v2/{gameId}/shop/buy/{itemId}
game.api.check-rep=/api/v2/{gameId}/investigate/reputation
