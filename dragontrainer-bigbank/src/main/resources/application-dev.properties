spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:dragontrainer}
spring.datasource.username=${POSTGRES_USER:dragon}
spring.datasource.password=${POSTGRES_PASSWORD:dragon}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update

spring.docker.compose.file=compose.yaml

game.api.base-url=${GAME_API_BASE_URL:https://dragonsofmugloar.com}
game.api.start-game=${GAME_API_START_PATH:/api/v2/game/start}
game.api.fetch-ads=${GAME_API_GET_TASKS_PATH:/api/v2/{gameId}/messages}
game.api.solve-task=${GAME_API_SOLVE_TASK_PATH:/api/v2/{gameId}/solve/{adId}}
game.api.open-store=${GAME_API_OPEN_STORE_PATH:/api/v2/{gameId}/shop}
game.api.buy-item=${GAME_API_BUY_ITEM_PATH:/api/v2/{gameId}/shop/buy/{itemId}}
game.api.check-rep=${GAME_API_CHECK_REP_PATH:/api/v2/{gameId}/investigate/reputation}

game.bot.enabled=${GAME_BOT_ENABLED:false}
