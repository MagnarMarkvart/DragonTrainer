services:
  postgres:
    image: postgres:16-alpine
    container_name: dragontrainer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dragontrainer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragon -d dragontrainer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  dragontrainer_pgdata:
